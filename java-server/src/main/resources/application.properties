# ============================================================
# OPay Banking Server – application.properties
# ============================================================

server.port=8080
spring.application.name=opay-server

# ── Database (H2 persistent file-based storage) ──────────────
# Data is stored in ./data/opaydb.mv.db (survives restarts)
# AUTO_SERVER=TRUE allows concurrent connections (e.g., H2 console while server runs)
spring.datasource.url=jdbc:h2:file:./data/opaydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=opay
spring.datasource.password=opay_secret
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow H2 console to be accessed from remote (dev only – disable in production)
spring.h2.console.settings.web-allow-others=false

# ── Android Wi-Fi SMS Gateway Configuration ──────────────────
# The IP address of the Android phone on the local Wi-Fi network
opay.gateway.android.host=192.168.1.50
opay.gateway.android.port=8088
# Full URL that the Android SMS Gateway app exposes for outgoing SMS
opay.gateway.android.send-url=http://${opay.gateway.android.host}:${opay.gateway.android.port}/send

# ── Cryptography ─────────────────────────────────────────────
# P-256 server keypair (base64-encoded); generate with KeyGenTool on first run
opay.crypto.server-private-key=MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgvGeYm0oEx7AE1qJKl8R43y4afj5G2fBJ2oixd31KYM6gCgYIKoZIzj0DAQehRANCAARYKtqaMXoEbEQCsopcuIW5bdl8ieaUZ1NVk0bcYJlqAQWsYjD8Xx0NpqJs6GWhtBKYNArs+RU1sXbnreZWiQKP
opay.crypto.server-public-key=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEWCramjF6BGxEArKKXLiFuW3ZfInmlGdTVZNG3GCZagEFrGIw/F8dDaaibOhlobQSmDQK7PkVNbF2563mVokCjw==

# Replay attack window: reject transactions older than this many seconds
opay.security.replay-window-seconds=300

# ── SMS Protocol ──────────────────────────────────────────────
opay.sms.prefix=OPAY-TXN:
opay.sms.balance-prefix=OPAY-BAL:
opay.sms.response-prefix=OPAY-RSP:
opay.sms.max-length=160

# ── Logging ───────────────────────────────────────────────────
logging.level.com.opay=DEBUG
logging.level.org.springframework.web=INFO
